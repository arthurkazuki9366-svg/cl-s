# ============================================================
#  SharkClans - Sistema de Clãs para o SharkSMP
#  Compatível com Paper 1.20+
#  Use /clan admin recarregar para aplicar mudanças deste arquivo.
# ============================================================

# Prefixo adicionado antes das mensagens do plugin
prefix: "&3&lSharkSMP &8» &r"

clan:
  # Quantidade máxima de membros por clã (incluindo líder e sub-líderes)
  max-members: 10
  # Quantidade máxima de sub-líderes por clã (-1 = ilimitado)
  max-sub-leaders: 3
  # Sub-líderes podem expulsar membros comuns?
  sub-leader-can-kick: true
  # Tempo (em segundos) até um convite expirar
  invite-expire-seconds: 60

  name:
    # Tamanho do nome do clã (apenas letras, números e _)
    min-length: 3
    max-length: 16

  tag:
    # Tamanho da tag (apenas letras e números)
    min-length: 2
    max-length: 5
    # Cor inicial da tag: 0-9 ou a-f (ex.: b = ciano). O líder pode mudar na GUI.
    default-color: "b"
    # Como a tag aparece antes do nome. Variáveis: {color} e {tag}
    chat-format: "&8[{color}{tag}&8] &r"

chat:
  # Mostrar a tag antes do nome dos jogadores no chat?
  show-tag: true
  # Texto entre o nome do jogador e a mensagem
  separator: "&7: &f"
  # Registrar o chat do clã no console?
  log-clan-chat: true

# Nomes dos cargos
roles:
  leader: "Líder"
  sub-leader: "Sub-líder"
  member: "Membro"

# ------------------------------------------------------------
#  Mensagens (suportam cores com & e hex com &#rrggbb)
